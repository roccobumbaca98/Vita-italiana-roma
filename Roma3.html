<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VITA ITALIANA: ROMA 3D 3.1 · GUIDA MIGLIORATA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a6d2ef;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;font-weight:750;text-shadow:0 2px 5px #000b}#status,#message{background:#193348c9;border-radius:11px;padding:9px 12px}#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}#controls{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.group{display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;font-weight:750;text-shadow:0 2px 5px #000;pointer-events:none}.stick{width:min(31vw,134px);height:min(31vw,134px);border:3px solid #fff9;border-radius:50%;background:#173e6099;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;width:44%;height:44%;left:28%;top:28%;border-radius:50%;background:#e6f3f3e0;border:2px solid #fff;pointer-events:none}#actions{position:fixed;top:100px;right:10px;display:flex;flex-direction:column;gap:8px}button{border:1px solid #d3e9ff9a;background:#164363df;color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;touch-action:manipulation}#enter{background:#25765ce8;display:none}#error{position:fixed;inset:15%;z-index:5;display:none;background:#233747;padding:20px;border-radius:12px}#tip{position:fixed;bottom:calc(165px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;background:#1b394ab8;padding:7px 10px;border-radius:10px;white-space:nowrap;pointer-events:none}@media(max-height:570px){#actions{top:50px}.stick{width:min(28vh,108px);height:min(28vh,108px)}#tip{display:none}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status">🇮🇹 VITA ITALIANA · ROMA 3.1 · GUIDA MIGLIORATA<br><span id="fps">Avvio 3D...</span></div><div>🏛️ Roma · guida libera</div></div><div id="message">Esplora la città e avvicinati a un'auto!</div><div id="actions"><button id="enter">🚗 ENTRA</button><button id="run">🏃 CORRI</button><button id="reset">🎥 CENTRA</button><button id="quality">⚙️ GRAFICA</button></div><div id="tip">Sinistra: muovi / guida · Destra: visuale</div><div id="controls"><div class="group">MOVIMENTO<div class="stick" id="move"><div class="knob"></div></div></div><div class="group">VISUALE<div class="stick" id="look"><div class="knob"></div></div></div></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id), canvas=$('game');let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}catch(e){$('error').style.display='block';$('error').textContent='WebGL non disponibile: '+e.message;throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#a6d2ef');scene.fog=new THREE.Fog('#a6d2ef',65,145);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,220);
scene.add(new THREE.HemisphereLight(0xffffff,0x8b8279,2.1));const sun=new THREE.DirectionalLight(0xffedce,2.2);sun.position.set(-30,60,25);scene.add(sun);
const mat=c=>new THREE.MeshLambertMaterial({color:c});const ground=mat('#87a66e'),road=mat('#565b5d'),pavement=mat('#c8bdae'),white=mat('#eae6d9'),yellow=mat('#e7ce85'),roof=mat('#aa5e4a'),glass=mat('#759caf'),trunk=mat('#826249'),leaf=mat('#58895a');const walls=['#d5b091','#d9c3aa','#d7a48d','#e5d1b6','#c3b8a6','#d2b99e'].map(mat);
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o;}
box(170,.12,170,ground,0,-.13,0);const roads=[-48,-24,0,24,48];for(const a of roads){box(8,.03,150,road,a,.015,0);box(150,.03,8,road,0,.016,a);for(const s of [-1,1]){box(2,.13,150,pavement,a+s*5,.08,0);box(150,.13,2,pavement,0,.08,a+s*5);}for(let t=-68;t<=68;t+=8){box(.12,.025,3,yellow,a,.044,t);box(3,.025,.12,yellow,t,.045,a);}}
// Crosswalks at intersections.
for(const x of roads)for(const z of roads){for(let k=-3;k<=3;k++){box(.55,.028,2.5,white,x+k*.98,.052,z+7);box(2.5,.028,.55,white,x+7,.052,z+k*.98);}}
const solids=[];function building(x,z,w,d,h,idx){box(w,h,d,walls[idx%walls.length],x,h/2,z);box(w+.65,.55,d+.65,roof,x,h+.2,z);solids.push({x,z,w:w/2+.7,d:d/2+.7});const floors=Math.floor((h-1.5)/3);for(let f=0;f<floors;f++){const yy=2.7+f*3;for(let k=-w/2+2;k<w/2-1;k+=3){box(1.3,1.6,.09,glass,x+k,yy,z+d/2+.07);box(1.3,1.6,.09,glass,x+k,yy,z-d/2-.07);}for(let k=-d/2+2;k<d/2-1;k+=3){box(.09,1.6,1.3,glass,x+w/2+.07,yy,z+k);box(.09,1.6,1.3,glass,x-w/2-.07,yy,z+k);}}box(2.1,2.8,.12,mat('#775947'),x,1.4,z+d/2+.08);}
for(let ix=0;ix<4;ix++)for(let iz=0;iz<4;iz++){const x=-36+ix*24,z=-36+iz*24;if(ix===2&&iz===2)continue;const h=9+((ix*7+iz*3)%5)*2.5;building(x,z,11.5,12,h,ix+iz);}
// Small Roman-inspired piazza: monument, columns, fountain.
const px=12,pz=12;box(16,.13,16,mat('#d8cab2'),px,.04,pz);const marble=mat('#e8ddc8');box(6,.8,6,marble,px,.48,pz);box(3,4,3,marble,px,2.85,pz);box(4,.45,4,marble,px,5.1,pz);const statue=new THREE.Mesh(new THREE.CylinderGeometry(.25,.5,2.4,8),marble);statue.position.set(px,6.5,pz);scene.add(statue);for(const sx of [-1,1])for(const sz of [-1,1]){const x=px+sx*6,z=pz+sz*6;const base=box(1.3,.35,1.3,marble,x,.2,z);const col=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,3.5,10),marble);col.position.set(x,2.1,z);scene.add(col);box(1.2,.35,1.2,marble,x,4,z);}
// Decorative trees and streetlights.
for(let z=-65;z<=65;z+=13)for(const x of [-54,-30,-6,18,42,54]){if(Math.abs(z-12)<9&&Math.abs(x-12)<11)continue;box(.3,2.5,.3,trunk,x,1.3,z);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.4,8,6),leaf);crown.position.set(x,3.3,z);scene.add(crown);}
const metal=mat('#4d5054'),lamp=mat('#fff5c4');for(let z=-54;z<=54;z+=24)for(const x of [-18,30]){box(.16,5,.16,metal,x,2.5,z);box(1.2,.2,.6,lamp,x+.55,5.05,z);}
function human(shirt='#3076b0'){const root=new THREE.Group();box(.72,1.05,.43,mat(shirt),0,1.3,0,root);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,10,8),mat('#dcae8c'));head.position.set(0,2.1,0);root.add(head);const limbs=[];for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.21,.82,0);box(.28,.82,.3,mat('#394356'),0,-.41,0,leg);root.add(leg);limbs.push(leg);const arm=new THREE.Group();arm.position.set(s*.49,1.72,0);box(.21,.78,.22,mat('#dcae8c'),0,-.39,0,arm);root.add(arm);limbs.push(arm);}root.userData.limbs=limbs;return root;}
const player=human();scene.add(player);player.position.set(-24,0,-24);let yaw=0,pitch=.23,run=false,playerSpeed=0,driving=null,steering=0,cameraHeading=0,lookOffset=0;
const people=[];for(let i=0;i<18;i++){const p=human(['#ad5950','#518a69','#b48c50','#8273a9'][i%4]);scene.add(p);const axis=i%2?'x':'z',lane=roads[i%5]+(i%3?5.5:-5.5);people.push({mesh:p,axis,lane,t:-55+(i*17)%110,dir:i%3?-1:1,phase:i*.8});}
function car(color){const g=new THREE.Group();box(2.05,.65,4,mat(color),0,.72,0,g);box(1.6,.7,2.1,glass,0,1.34,-.22,g);for(const x of [-1.04,1.04])for(const z of [-1.3,1.3]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.2,10),mat('#292b30'));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.38,z);g.add(wheel);}box(1.5,.18,.12,lamp,0,.72,-2.02,g);return g;}
const cars=[];for(let i=0;i<9;i++){const mesh=car(['#c94c42','#e4d5b6','#3c80b0','#e2b84e','#6e8970'][i%5]);scene.add(mesh);const axis=i%2?'x':'z',lane=roads[i%5]+(i%2?1.8:-1.8);cars.push({mesh,axis,lane,t:-57+i*13,dir:i%3?-1:1,drivable:i<5});}
// Parked, accessible cars near the spawn intersection.
for(let i=0;i<3;i++){const mesh=car(['#c74943','#3f86bc','#e2d6bf'][i]);scene.add(mesh);mesh.position.set(-21-i*5,0,-24);mesh.rotation.y=Math.PI/2;cars.push({mesh,axis:'parked',lane:0,t:0,dir:0,drivable:true});}
const sticks={move:{x:0,y:0},look:{x:0,y:0}};function bindStick(id){const el=$(id),knob=el.querySelector('.knob'),v=sticks[id];let active=null;function update(e){const r=el.getBoundingClientRect(),radius=r.width*.28;let x=(e.clientX-r.left-r.width/2)/radius,y=(e.clientY-r.top-r.height/2)/radius;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}v.x=x;v.y=y;knob.style.transform=`translate(${x*radius}px,${y*radius}px)`;}el.addEventListener('pointerdown',e=>{if(active!==null)return;active=e.pointerId;el.setPointerCapture(active);update(e);e.preventDefault();});el.addEventListener('pointermove',e=>{if(e.pointerId===active){update(e);e.preventDefault();}});const end=e=>{if(e.pointerId!==active)return;active=null;v.x=v.y=0;knob.style.transform='translate(0,0)';};for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,end);}bindStick('move');bindStick('look');
$('run').onclick=()=>{run=!run;$('run').textContent=run?'🚶 CAMMINA':'🏃 CORRI';};$('reset').onclick=()=>{if(driving){lookOffset=0;cameraHeading=driving.mesh.rotation.y;}else{yaw=0;}pitch=.23;};let low=false;$('quality').onclick=()=>{low=!low;renderer.setPixelRatio(low?1:Math.min(devicePixelRatio||1,1.5));$('quality').textContent=low?'⚙️ LEGGERA':'⚙️ GRAFICA';};
function blocked(x,z){if(Math.abs(x)>69||Math.abs(z)>69)return true;return solids.some(b=>Math.abs(x-b.x)<b.w+.25&&Math.abs(z-b.z)<b.d+.25);}
let nearest=null;function findCar(){let best=4.4,out=null;for(const c of cars){if(!c.drivable)continue;const d=player.position.distanceTo(c.mesh.position);if(d<best){best=d;out=c;}}return out;}
$('enter').onclick=()=>{if(driving){const c=driving;const right=new THREE.Vector3(Math.cos(c.mesh.rotation.y),0,-Math.sin(c.mesh.rotation.y));let exit=c.mesh.position.clone().addScaledVector(right,3.2);if(blocked(exit.x,exit.z))exit=c.mesh.position.clone().addScaledVector(right,-3.2);player.position.copy(exit);player.position.y=0;player.visible=true;driving=null;carSpeed=0;steering=0;yaw=cameraHeading; $('enter').textContent='🚗 ENTRA';$('message').textContent='Sei sceso dall’auto';}else if(nearest){driving=nearest;player.visible=false;carSpeed=0;steering=0;lookOffset=0;cameraHeading=driving.mesh.rotation.y;pitch=.18;$('enter').textContent='🚶 ESCI';$('message').textContent='Guida: avanti/indietro e sterza col joystick sinistro';}};
const clock=new THREE.Clock(),target=new THREE.Vector3(),desired=new THREE.Vector3();let elapsed=0,frames=0,fpsTime=0,carSpeed=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.045);elapsed+=dt;const m=sticks.move,l=sticks.look;
if(driving){
  const c=driving.mesh;
  // Accelerazione e frenata progressive: joystick avanti = avanti.
  const throttle=Math.abs(m.y)<.12?0:-m.y;
  const maxSpeed=12;
  carSpeed=THREE.MathUtils.damp(carSpeed,throttle*maxSpeed,throttle===0?3.3:1.9,dt);
  if(Math.abs(carSpeed)<.025)carSpeed=0;
  // Sterzo filtrato, meno sensibile alle alte velocita e senza rotazioni da fermo.
  const steerInput=Math.abs(m.x)<.10?0:m.x;
  steering=THREE.MathUtils.damp(steering,steerInput,7.5,dt);
  const speedFactor=Math.min(Math.abs(carSpeed)/3,1);
  const steerRate=1.45/(1+Math.abs(carSpeed)*.065);
  if(speedFactor>.01)c.rotation.y-=steering*steerRate*speedFactor*dt*Math.sign(carSpeed);
  const nx=c.position.x-Math.sin(c.rotation.y)*carSpeed*dt;
  const nz=c.position.z-Math.cos(c.rotation.y)*carSpeed*dt;
  if(!blocked(nx,nz)){c.position.x=nx;c.position.z=nz;}else carSpeed=0;
  // La visuale segue la direzione dell'auto, senza rimanere bloccata sull'angolo iniziale.
  lookOffset=THREE.MathUtils.clamp(lookOffset-l.x*1.45*dt,-1.1,1.1);
  if(Math.abs(l.x)<.08)lookOffset=THREE.MathUtils.damp(lookOffset,0,1.5,dt);
  pitch=THREE.MathUtils.clamp(pitch+l.y*1.0*dt,-.16,.58);
  const followAngle=c.rotation.y+lookOffset;
  cameraHeading+=Math.atan2(Math.sin(followAngle-cameraHeading),Math.cos(followAngle-cameraHeading))*(1-Math.exp(-5.5*dt));
  target.set(c.position.x,1.3,c.position.z);
  const dist=9.4,flat=Math.cos(pitch)*dist;
  desired.set(target.x+Math.sin(cameraHeading)*flat,target.y+3+Math.sin(pitch)*dist,target.z+Math.cos(cameraHeading)*flat);
  $('enter').style.display='block';
}
else{yaw-=l.x*1.8*dt;pitch=THREE.MathUtils.clamp(pitch+l.y*1.2*dt,-.25,.7);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const velocity=forward.multiplyScalar(-m.y).addScaledVector(right,m.x),mag=Math.min(1,velocity.length());playerSpeed=THREE.MathUtils.damp(playerSpeed,(run?7:4.2)*mag,10,dt);if(mag>.08){velocity.normalize();const nx=player.position.x+velocity.x*playerSpeed*dt,nz=player.position.z+velocity.z*playerSpeed*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(-velocity.x,-velocity.z);}const step=elapsed*(run?12:8);for(let i=0;i<4;i++)player.userData.limbs[i].rotation.x=Math.sin(step+(i===0||i===3?0:Math.PI))*Math.min(.55,playerSpeed*.12);target.set(player.position.x,1.55,player.position.z);const dist=6.8,flat=Math.cos(pitch)*dist;desired.set(target.x+Math.sin(yaw)*flat,target.y+2+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*flat);nearest=findCar();$('enter').style.display=nearest?'block':'none';if(nearest)$('message').textContent='🚗 Auto vicina: premi ENTRA per guidare';}
for(const p of people){p.t+=p.dir*dt*1.1;if(p.t>63)p.t=-63;if(p.t< -63)p.t=63;p.mesh.position.set(p.axis==='x'?p.t:p.lane,0,p.axis==='z'?p.t:p.lane);p.mesh.rotation.y=p.axis==='x'?(p.dir>0?-Math.PI/2:Math.PI/2):(p.dir>0?Math.PI:0);for(let i=0;i<4;i++)p.mesh.userData.limbs[i].rotation.x=Math.sin(elapsed*8+p.phase+(i===0||i===3?0:Math.PI))*.35;}
for(const c of cars){if(c.axis==='parked'||c===driving)continue;c.t+=c.dir*dt*5.5;if(c.t>63)c.t=-63;if(c.t< -63)c.t=63;c.mesh.position.set(c.axis==='x'?c.t:c.lane,0,c.axis==='z'?c.t:c.lane);c.mesh.rotation.y=c.axis==='x'?(c.dir>0?-Math.PI/2:Math.PI/2):(c.dir>0?Math.PI:0);}
camera.position.lerp(desired,1-Math.exp(-10*dt));camera.lookAt(target);renderer.render(scene,camera);frames++;fpsTime+=dt;if(fpsTime>.8){$('fps').textContent=`${Math.round(frames/fpsTime)} FPS · ${driving?'🚗 Guida':'🚶 A piedi'}`;frames=0;fpsTime=0;}}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});animate();
</script></body></html>
