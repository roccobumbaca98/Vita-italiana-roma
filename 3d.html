<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VITA ITALIANA ROMA 3.0 · WebGL</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ecae8;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 5px #000b;font-weight:700;font-size:13px}#hud a{pointer-events:auto;color:white;background:#182d44c9;border-radius:10px;padding:8px;text-decoration:none}#status{background:#152c45bb;padding:9px;border-radius:10px;max-width:60%}#help{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#183044a8;border-radius:10px;padding:7px 12px;font-size:11px;text-align:center;white-space:nowrap;pointer-events:none}#sticks{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.stick-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;font-size:11px;font-weight:700;text-shadow:0 2px 4px #000}.stick{pointer-events:auto;touch-action:none;width:min(33vw,146px);height:min(33vw,146px);border:3px solid #e1f1ffad;border-radius:50%;background:#1737528f;position:relative;box-shadow:0 0 0 4px #122f4755}.knob{width:44%;height:44%;border-radius:50%;position:absolute;left:28%;top:28%;background:#d3e9f2d9;border:2px solid white;pointer-events:none;transform:translate(0,0)}#buttons{position:fixed;right:12px;top:100px;display:flex;flex-direction:column;gap:8px}button{background:#123a56db;border:1px solid #c0e4ff8a;color:white;padding:10px 12px;border-radius:10px;font-weight:700;font-size:12px;touch-action:manipulation}#notice{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + min(33vw,146px) + 55px);left:50%;transform:translateX(-50%);font-size:12px;background:#142d43ce;border-radius:10px;padding:8px 10px;white-space:nowrap;pointer-events:none;max-width:95vw;text-align:center}#error{display:none;position:fixed;inset:20%;background:#152d44;color:white;padding:20px;border-radius:12px;z-index:8}#fps{font-variant-numeric:tabular-nums}@media(max-height:580px){#help{display:none}#buttons{top:55px}.stick{width:min(28vh,115px);height:min(28vh,115px)}#notice{bottom:140px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status">🇮🇹 ROMA 3.0 · WebGL<br><span id="fps">Avvio...</span></div><a href="index.html">↩ Vita classica</a></div><div id="help">Sinistra: cammina · Destra: guarda intorno</div><div id="buttons"><button id="run">🏃 CORRI</button><button id="reset">🎥 CENTRA</button><button id="quality">⚙️ GRAFICA: AUTO</button></div><div id="notice">Vero 3D · strade, edifici e personaggi nello stesso spazio</div><div id="sticks"><div class="stick-wrap">MOVIMENTO<div class="stick" id="move"><div class="knob"></div></div></div><div class="stick-wrap">VISUALE<div class="stick" id="look"><div class="knob"></div></div></div></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const canvas=document.getElementById('game'),error=document.getElementById('error');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}catch(e){error.style.display='block';error.textContent='WebGL non disponibile: '+e.message;throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#9bc9e8');scene.fog=new THREE.Fog('#9bc9e8',50,130);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,180);
scene.add(new THREE.HemisphereLight(0xffffff,0x718090,2));const sun=new THREE.DirectionalLight(0xfff3d2,2.1);sun.position.set(-18,40,22);scene.add(sun);
const mat=(color)=>new THREE.MeshLambertMaterial({color});const road=mat('#454d53'),grass=mat('#76a46c'),walk=mat('#c6bfb2'),line=mat('#f2e8b6'),wallM=['#d5a68c','#e2c7a2','#c6b5a8','#c9a28b','#b8c3ba'].map(mat),roof=mat('#a75847'),windowMat=mat('#7cabc4'),treeMat=mat('#4d8b51'),trunkMat=mat('#806048');
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o;}
box(160,.08,160,grass,0,-.09,0);
// Cross-shaped road network with sidewalks at consistent ground height.
const roadCoords=[-36,-12,12,36];for(const a of roadCoords){box(8,.025,130,road,a,.01,0);box(130,.025,8,road,0,.012,a);for(const side of [-1,1]){box(1.8,.1,130,walk,a+side*4.9,.06,0);box(130,.1,1.8,walk,0,.065,a+side*4.9);}for(let t=-60;t<61;t+=7){box(.12,.02,3,line,a,.034,t);box(3,.02,.12,line,t,.035,a);}}
// Buildings occupy blocks, never roads.
const solids=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){const x=-24+i*24,z=-24+j*24;const h=8+((i*7+j*5)%5)*2.4;const w=12,d=12;box(w,h,d,wallM[(i+j)%wallM.length],x,h/2,z);box(w+.7,.7,d+.7,roof,x,h+.2,z);solids.push({x,z,r:7.5});for(let f=2;f<h-1;f+=3.1)for(let a=-3.8;a<=3.8;a+=3.8){box(1.7,1.7,.08,windowMat,x+a,f,z+d/2+.055);box(1.7,1.7,.08,windowMat,x+a,f,z-d/2-.055);}box(2.2,3,.12,mat('#735e50'),x,1.5,z+d/2+.1);}
// Trees along sidewalk; decorative only.
for(let t=-50;t<=50;t+=12){for(const x of [-42,-18,6,30,42]){if(Math.abs(x-t)<7)continue;box(.4,2,.4,trunkMat,x,1,t+6.2);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,8,6),treeMat);crown.position.set(x,3.1,t+6.2);scene.add(crown);}}
function human(shirt='#2868a2',pants='#303d54',skin='#e4b48b'){const root=new THREE.Group(),torso=new THREE.Group();root.add(torso);box(.78,1.03,.42,mat(shirt),0,1.28,0,torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,10,8),mat(skin));head.position.set(0,2.05,0);torso.add(head);const limbs=[];for(let side of [-1,1]){const leg=new THREE.Group();leg.position.set(side*.23,.79,0);box(.29,.8,.3,mat(pants),0,-.4,0,leg);root.add(leg);limbs.push(leg);const arm=new THREE.Group();arm.position.set(side*.52,1.7,0);box(.22,.8,.23,mat(skin),0,-.4,0,arm);root.add(arm);limbs.push(arm);}root.userData.limbs=limbs;return root;}
const player=human('#2b82cf');scene.add(player);player.position.set(0,0,0);let yaw=0,pitch=.24,speed=0,run=false;
const people=[];const routes=[[-36,-29,-36,29],[-12,-29,-12,29],[12,-29,12,29],[36,-29,36,29],[-29,-36,29,-36],[-29,12,29,12]];
for(let i=0;i<12;i++){const p=human(['#b34c45','#398363','#ad8649','#8167aa'][i%4]);scene.add(p);const r=routes[i%routes.length];const k=(i%5)/5;const x=r[0]+(r[2]-r[0])*k,z=r[1]+(r[3]-r[1])*k;p.position.set(x+(r[0]===r[2]?5.6:0),0,z+(r[1]===r[3]?5.6:0));people.push({mesh:p,route:r,t:k,dir:i%2?1:-1,phase:i*.8});}
function car(color){const g=new THREE.Group();box(2.05,.65,4.1,mat(color),0,.65,0,g);box(1.65,.7,2.2,mat('#7aa4b5'),0,1.32,-.25,g);for(let x of [-1.05,1.05])for(let z of [-1.35,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.2,10),mat('#23292e'));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.37,z);g.add(wheel);}return g;}
const cars=[];for(let i=0;i<7;i++){const g=car(['#d74943','#e0d6c5','#3d79b4','#e3b24d'][i%4]);scene.add(g);cars.push({mesh:g,axis:i%2?'x':'z',lane:roadCoords[i%4]+(i%2?1.8:-1.8),t:-52+i*15,dir:i%2?1:-1});}
const sticks={move:{x:0,y:0},look:{x:0,y:0}};
function bindStick(id){const el=document.getElementById(id),knob=el.querySelector('.knob'),v=sticks[id];let active=null;const update=e=>{const r=el.getBoundingClientRect(),radius=r.width*.28;let x=(e.clientX-r.left-r.width/2)/radius,y=(e.clientY-r.top-r.height/2)/radius;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}v.x=x;v.y=y;knob.style.transform=`translate(${x*radius}px,${y*radius}px)`;};el.addEventListener('pointerdown',e=>{if(active!==null)return;active=e.pointerId;el.setPointerCapture(active);update(e);e.preventDefault();});el.addEventListener('pointermove',e=>{if(e.pointerId===active){update(e);e.preventDefault();}});const end=e=>{if(e.pointerId!==active)return;active=null;v.x=v.y=0;knob.style.transform='translate(0,0)';};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);}
bindStick('move');bindStick('look');document.getElementById('run').onclick=()=>{run=!run;document.getElementById('run').textContent=run?'🚶 CAMMINA':'🏃 CORRI';};document.getElementById('reset').onclick=()=>{yaw=0;pitch=.24;};let low=false;document.getElementById('quality').onclick=()=>{low=!low;renderer.setPixelRatio(low?1:Math.min(devicePixelRatio,1.6));document.getElementById('quality').textContent=low?'⚙️ GRAFICA: LEGGERA':'⚙️ GRAFICA: AUTO';};
function blocked(x,z){if(Math.abs(x)>59||Math.abs(z)>59)return true;return solids.some(b=>Math.abs(x-b.x)<7.2&&Math.abs(z-b.z)<7.2);}
const clock=new THREE.Clock();let elapsed=0,frames=0,fpsTime=0;const target=new THREE.Vector3(),desired=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const m=sticks.move,l=sticks.look;yaw-=l.x*1.9*dt;pitch=THREE.MathUtils.clamp(pitch+l.y*1.25*dt,-.3,.85);
const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const velocity=forward.multiplyScalar(-m.y).addScaledVector(right,m.x);const magnitude=Math.min(1,velocity.length());const desiredSpeed=(run?7:4.1)*magnitude;speed=THREE.MathUtils.damp(speed,desiredSpeed,10,dt);
if(magnitude>.08){velocity.normalize();const nx=player.position.x+velocity.x*speed*dt,nz=player.position.z+velocity.z*speed*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(-velocity.x,-velocity.z);}
const step=elapsed*(run?12:8);for(let i=0;i<4;i++){player.userData.limbs[i].rotation.x=Math.sin(step+(i===0||i===3?0:Math.PI))*Math.min(.52,speed*.12);}
for(const p of people){p.t+=p.dir*dt*.022;if(p.t>1){p.t=1;p.dir=-1;}if(p.t<0){p.t=0;p.dir=1;}const r=p.route;p.mesh.position.x=r[0]+(r[2]-r[0])*p.t+(r[0]===r[2]?5.6:0);p.mesh.position.z=r[1]+(r[3]-r[1])*p.t+(r[1]===r[3]?5.6:0);p.mesh.rotation.y=r[0]===r[2]?(p.dir>0?-Math.PI/2:Math.PI/2):(p.dir>0?Math.PI:0);for(let i=0;i<4;i++)p.mesh.userData.limbs[i].rotation.x=Math.sin(elapsed*8+p.phase+(i===0||i===3?0:Math.PI))*.36;}
for(const c of cars){c.t+=c.dir*dt*6;if(c.t>56)c.t=-56;if(c.t< -56)c.t=56;c.mesh.position.set(c.axis==='x'?c.t:c.lane,0,c.axis==='z'?c.t:c.lane);c.mesh.rotation.y=c.axis==='x'?(c.dir>0?-Math.PI/2:Math.PI/2):(c.dir>0?Math.PI:0);}
// Orbit around player's fixed head height. Pitch changes camera position, never player height.
target.set(player.position.x,1.55,player.position.z);const distance=6.4,flat=Math.cos(pitch)*distance;desired.set(target.x+Math.sin(yaw)*flat,target.y+2.0+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*flat);camera.position.lerp(desired,1-Math.exp(-10*dt));camera.lookAt(target);renderer.render(scene,camera);frames++;fpsTime+=dt;if(fpsTime>.8){document.getElementById('fps').textContent=`${Math.round(frames/fpsTime)} FPS · 3D reale`;frames=0;fpsTime=0;}}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});animate();
</script></body></html>
